<!-- templates/includes/_modals.html -->

<!-- DETAIL MODAL -->
<div class="modal-overlay" id="detail-modal">
  <div class="modal modal-lg">
    <div class="modal-header">
      <div>
        <h2 id="modal-name">Attachee Details</h2>
        <div class="modal-sub" id="modal-id"></div>
      </div>
      <button class="modal-close" onclick="closeModal('detail-modal')">
        ✕
      </button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<!-- ADD MODAL -->
<div class="modal-overlay" id="add-modal">
  <div class="modal modal-lg">
    <div class="modal-header">
      <div>
        <h2 id="add-modal-title">Add New Attachee</h2>
        <div class="modal-sub">Fill in all required fields</div>
      </div>
      <button class="modal-close" onclick="closeModal('add-modal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group">
          <label>Full Name *</label>
          <input
            id="f-name"
            type="text"
            placeholder="e.g. Jane Wanjiku Mwangi"
          />
        </div>
        <div class="form-group add-mode-attachee">
          <label>Student ID *</label>
          <input id="f-id" type="text" placeholder="e.g. 12345678" />
        </div>
        <div class="form-group">
          <label>Contact</label>
          <input id="f-contact" type="text" placeholder="+254..." />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input id="f-email" type="email" placeholder="email@example.com" />
        </div>
        <div class="form-group">
          <label>Emergency Contact</label>
          <input id="f-emergency" type="text" placeholder="Name / number" />
        </div>
        <div class="form-group">
          <label>Course / Programme</label>
          <input
            id="f-course"
            type="text"
            placeholder="e.g. International Relations"
          />
        </div>
        <div class="form-group add-mode-attachee">
          <label>Year of Study</label>
          <input
            id="f-year"
            type="number"
            placeholder="1 – 7"
            min="1"
            max="7"
          />
        </div>
        <div class="form-group">
          <label>Department *</label>
          <select id="f-dept" onchange="loadSupervisorsForAdd()">
            <option value="">Select department…</option>
            {% for dept in departments %}
            <option value="{{ dept.id }}">{{ dept.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Supervisor</label>
          <select id="f-supervisor">
            <option value="">Select supervisor…</option>
          </select>
        </div>
        <div class="form-group">
          <label>Supervisor Contact</label>
          <input
            id="f-sup-contact"
            type="text"
            placeholder="+254..."
            readonly
          />
        </div>
        <div class="form-group">
          <label>Start Date *</label>
          <input id="f-start" type="date" />
        </div>
        <div class="form-group">
          <label>End Date *</label>
          <input id="f-end" type="date" />
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="f-status">
            <option value="active">Active</option>
            <option value="completed">Completed</option>
            <option value="on_hold">On Hold</option>
            <option value="withdrawn">Withdrawn</option>
          </select>
        </div>
        <div class="form-group">
          <label>Notes</label>
          <input id="f-notes" type="text" placeholder="Any additional notes" />
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-ghost" onclick="closeModal('add-modal')">
          Cancel
        </button>
        <button
          class="btn btn-primary"
          id="add-modal-submit"
          onclick="submitAddModal()"
        >
          ➕ Add Attachee
        </button>
      </div>
    </div>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal modal-lg">
    <div class="modal-header warning">
      <div>
        <h2>✏️ Edit Attachee</h2>
        <div class="modal-sub" id="edit-modal-sub">Editing record</div>
      </div>
      <button class="modal-close" onclick="closeModal('edit-modal')">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="e-original-id" />
      <div class="form-grid">
        <div class="form-group">
          <label>Full Name *</label>
          <input id="e-name" type="text" />
        </div>
        <div class="form-group">
          <label>Student ID *</label>
          <input id="e-id" type="text" />
        </div>
        <div class="form-group">
          <label>Contact</label>
          <input id="e-contact" type="text" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input id="e-email" type="email" />
        </div>
        <div class="form-group">
          <label>Emergency Contact</label>
          <input id="e-emergency" type="text" />
        </div>
        <div class="form-group">
          <label>Course / Programme</label>
          <input id="e-course" type="text" />
        </div>
        <div class="form-group">
          <label>Year of Study</label>
          <input id="e-year" type="number" min="1" max="7" />
        </div>
        <div class="form-group">
          <label>Department *</label>
          <select id="e-dept" onchange="loadSupervisorsForEdit()">
            {% for dept in departments %}
            <option value="{{ dept.id }}">{{ dept.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Supervisor</label>
          <select id="e-supervisor">
            <option value="">Select supervisor…</option>
          </select>
        </div>
        <div class="form-group">
          <label>Supervisor Contact</label>
          <input id="e-sup-contact" type="text" readonly />
        </div>
        <div class="form-group">
          <label>Start Date *</label>
          <input id="e-start" type="date" />
        </div>
        <div class="form-group">
          <label>End Date *</label>
          <input id="e-end" type="date" />
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="e-status">
            <option value="active">Active</option>
            <option value="completed">Completed</option>
            <option value="on_hold">On Hold</option>
            <option value="withdrawn">Withdrawn</option>
          </select>
        </div>
        <div class="form-group">
          <label>Notes</label>
          <input id="e-notes" type="text" />
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-ghost" onclick="closeModal('edit-modal')">
          Cancel
        </button>
        <button class="btn btn-warning" onclick="saveEdit()">
          💾 Save Changes
        </button>
      </div>
    </div>
  </div>
</div>

<!-- DELETE CONFIRM MODAL -->
<div class="modal-overlay" id="delete-modal">
  <div class="modal" style="width: 480px">
    <div class="modal-header danger">
      <div>
        <h2>🗑️ Delete Attachee</h2>
        <div class="modal-sub">This action cannot be undone</div>
      </div>
      <button class="modal-close" onclick="closeModal('delete-modal')">
        ✕
      </button>
    </div>
    <div class="modal-body">
      <div class="delete-confirm-box">
        <strong id="delete-name-display"></strong>
        Are you sure you want to permanently delete this record from the
        register?
      </div>
      <div class="form-actions">
        <button class="btn btn-ghost" onclick="closeModal('delete-modal')">
          Cancel
        </button>
        <button class="btn btn-danger" onclick="confirmDelete()">
          🗑️ Yes, Delete
        </button>
      </div>
    </div>
  </div>
</div>
()
