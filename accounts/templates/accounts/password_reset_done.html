{% extends 'base.html' %}
{% load static %}

{% block title %}Password Reset Sent{% endblock %}

{% block content %}
<div style="max-width:480px;margin:40px auto;">
    <div class="card">
        <div class="card-header">Password Reset Sent</div>
        <div style="padding:30px;">
            <p>If an account exists with the email you provided, a password reset link has been sent.</p>
            <a href="{% url 'accounts:login' %}" class="btn btn-primary" style="width:100%;">Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
